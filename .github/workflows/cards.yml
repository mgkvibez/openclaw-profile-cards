# Dogfood: this repo's own demo images are rendered by its own code.
# The demo cards in docs/demo/ are regenerated nightly from live data,
# which is also the proof that the generator works — the README you are
# reading is produced by the thing it documents.

name: cards

on:
  schedule:
    - cron: "41 2 * * *" # daily at 02:41 UTC
  push:
    paths:
      - "cards/**"
      - "testdata/**"
      - ".github/workflows/cards.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cards

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest cards.test_cards

      - name: Render demo (phosphor, amber, paper)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m cards.render --login mgkvibez --out docs/demo
          for t in amber paper; do
            python -m cards.render --login mgkvibez --out /tmp/demo-$t --theme $t
            cp /tmp/demo-$t/ubuntu.svg docs/themes/ubuntu-$t.svg
          done

      - name: Commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demo docs/themes
          if git diff --cached --quiet; then
            echo "demo cards unchanged"
            exit 0
          fi
          git commit -m "cards: refresh demo images from live data"
          git push
